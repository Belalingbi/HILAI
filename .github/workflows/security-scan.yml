name: Cybersécurité & Audit Statique

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 3 * * 1' # Chaque lundi matin

jobs:
  security-audit:
    name: Audit Bandit & CodeQL
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les outils d'audit
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety

      - name: Audit Bandit (Anti-vulnérabilités AST)
        run: bandit -r . -x ./tests,./docker -ll

      - name: Vérification des secrets (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
